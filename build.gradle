import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.github.ben-manes.versions' version '0.51.0'
}

group = 'no.fint'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javadoc {
    source = sourceSets.main.allJava
    classpath = configurations.runtimeClasspath
    options.windowTitle = 'fint profilbilde Adapter'
    options.memberLevel = JavadocMemberLevel.PRIVATE
    destinationDir = file('./javadocs/')
}

repositories {
    mavenCentral()
    repositories {
        maven {
            url "https://repo.fintlabs.no/releases"
        }
    }
    mavenLocal()
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    // SpringDoc OpenAPI replaces Springfox (Springfox is incompatible with Spring Boot 3)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    implementation 'org.jooq:jool:0.9.15'

    // NOTE: fint-sse / fint-event-model etc. may need newer versions for full Spring Boot 3 / Jakarta EE 10 compatibility
    implementation 'no.fint:fint-sse:1.4.1'
    implementation 'no.fint:fint-event-model:3.3.1'
    implementation 'no.fint:fint-relation-model:1.1.6'
    implementation 'no.fint:fint-profilbilde-resource-model-java:1.3.0-rc-2'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // bcprov-jdk18on replaces bcprov-jdk15on for JDK 18+
    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'

    testImplementation 'org.spockframework:spock-spring:2.4-groovy-5.0'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.register('copyExternalDependencies', Copy) {
    from configurations.runtimeClasspath
    into "$buildDir/deps/external"
    exclude '**/fint-*.jar'
}

tasks.register('copyFintDependencies', Copy) {
    from configurations.runtimeClasspath
    into "$buildDir/deps/fint"
    include '**/fint-*.jar'
}

build.dependsOn(copyExternalDependencies)
build.dependsOn(copyFintDependencies)

bootJar {
    enabled = false
}

jar {
    enabled = true
    manifest {
        attributes(
                "Manifest-Version": "1.0",
                "Main-Class": "no.fint.Application",
                "Specification-Version": "${apiVersion}",
                "Implementation-Version": "${project.version}",
                //"Class-Path": configurations.runtimeClasspath.collect { it.getName() }.join(' ')
        )
    }
}

processResources {
    filesMatching('**/*.yml') {
        filter(ReplaceTokens, tokens: [version: project.version.toString(), title: project.name])
    }
}

tasks.named('wrapper') {
    gradleVersion = '9.5.1'
}

bootRun {
    systemProperties System.properties
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
