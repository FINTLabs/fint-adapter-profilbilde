name: Publish to Reposilite

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a release tag such as v1.2.3 or v1.2.3-rc-1" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: temurin
          cache: gradle

      - name: Build and test
        run: sh ./gradlew --no-daemon build "-Pversion=$RELEASE_VERSION"

      - name: Publish to Reposilite
        env:
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
        run: |
          : "${REPOSILITE_USERNAME:?Set the REPOSILITE_USERNAME repository secret}"
          : "${REPOSILITE_PASSWORD:?Set the REPOSILITE_PASSWORD repository secret}"
          sh ./gradlew --no-daemon publish "-Pversion=$RELEASE_VERSION"
